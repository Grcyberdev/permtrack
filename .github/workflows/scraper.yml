name: Live Permit Scraper Workflow

on:
  repository_dispatch:
    types: [run-scraper]
  workflow_dispatch:
    inputs:
      date:
        description: 'Target Date (DD-MM-YYYY format, leave blank for today)'
        required: false
        default: ''
      bond:
        description: 'Bond Credentials (IMFL, CS, BOTH)'
        required: false
        default: 'BOTH'
      lookback_days:
        description: 'Lookback Days for Pending Permits (default: 7)'
        required: false
        default: '7'

jobs:
  scrape-permits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Portal Reachability & Configure Fallback Proxy
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          echo "🔍 Testing direct connectivity to stateexcise.assam.gov.in..."
          if curl -sI --connect-timeout 12 --max-time 18 https://stateexcise.assam.gov.in/index.php/site/login > /dev/null; then
            echo "✅ Direct connection to portal succeeded."
            echo "USE_TOR_PROXY=false" >> $GITHUB_ENV
          elif [ -n "$SCRAPER_API_KEY" ]; then
            echo "⚠️ Direct connection timed out, using configured SCRAPER_API_KEY proxy."
            echo "USE_TOR_PROXY=false" >> $GITHUB_ENV
          else
            echo "⚠️ Direct connection from US runner timed out (Geo-IP block). Installing Tor SOCKS5 fallback..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq tor netcat-openbsd
            printf "\nControlPort 9051\nCookieAuthentication 0\n" | sudo tee -a /etc/tor/torrc > /dev/null
            sudo service tor restart
            for i in $(seq 1 15); do
              if nc -z 127.0.0.1 9050 2>/dev/null; then
                echo "✅ Tor SOCKS5 proxy listening on 127.0.0.1:9050"
                break
              fi
              sleep 1
            done
            echo "USE_TOR_PROXY=true" >> $GITHUB_ENV
          fi

      - name: Run Permit Scraper
        env:
          TZ: "Asia/Kolkata"
          IMFL_USERNAME: ${{ secrets.IMFL_USERNAME }}
          IMFL_PASSWORD: ${{ secrets.IMFL_PASSWORD }}
          CS_USERNAME: ${{ secrets.CS_USERNAME }}
          CS_PASSWORD: ${{ secrets.CS_PASSWORD }}
          FLY_APP_URL: ${{ secrets.FLY_APP_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          TARGET_DATE="${{ github.event.client_payload.date || github.event.client_payload.target_date || github.event.inputs.date || '' }}"
          BOND_TYPE="${{ github.event.client_payload.bond || github.event.client_payload.bond_type || github.event.inputs.bond || 'BOTH' }}"
          LOOKBACK_DAYS="${{ github.event.client_payload.lookback_days || github.event.inputs.lookback_days || '' }}"
          
          CMD="python scripts/main_permits.py --headless"
          if [ -n "$TARGET_DATE" ]; then
            CMD="$CMD --date $TARGET_DATE"
          fi
          if [ -n "$BOND_TYPE" ]; then
            CMD="$CMD --bond $BOND_TYPE"
          fi
          if [ -n "$LOOKBACK_DAYS" ]; then
            CMD="$CMD --lookback-days $LOOKBACK_DAYS"
          fi
          
          echo "🚀 Executing: $CMD"
          eval $CMD

      - name: Upload Scraped JSON Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: permit-backups
          path: config/backup_permits_*.json
