name: Live Permit Scraper Workflow

on:
  repository_dispatch:
    types: [run-scraper]
  workflow_dispatch:
    inputs:
      date:
        description: 'Target Date (DD-MM-YYYY format, leave blank for today)'
        required: false
        default: ''
      bond:
        description: 'Bond Credentials (IMFL, CS, BOTH)'
        required: false
        default: 'BOTH'
      lookback_days:
        description: 'Lookback Days for Pending Permits (default: 7)'
        required: false
        default: '7'

jobs:
  scrape-permits:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Discover Verified Indian Proxy or Direct Connectivity
        run: |
          python -u scripts/find_indian_proxy.py

      - name: Run Permit Scraper
        env:
          TZ: "Asia/Kolkata"
          IMFL_USERNAME: ${{ secrets.IMFL_USERNAME }}
          IMFL_PASSWORD: ${{ secrets.IMFL_PASSWORD }}
          CS_USERNAME: ${{ secrets.CS_USERNAME }}
          CS_PASSWORD: ${{ secrets.CS_PASSWORD }}
          FLY_APP_URL: ${{ secrets.FLY_APP_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          INDIAN_PROXY: ${{ env.INDIAN_PROXY }}
          USE_INDIAN_PROXY: ${{ env.USE_INDIAN_PROXY }}
          PYTHONUNBUFFERED: "1"
        run: |
          TARGET_DATE="${{ github.event.client_payload.date || github.event.client_payload.target_date || github.event.inputs.date || '' }}"
          BOND_TYPE="${{ github.event.client_payload.bond || github.event.client_payload.bond_type || github.event.inputs.bond || 'BOTH' }}"
          LOOKBACK_DAYS="${{ github.event.client_payload.lookback_days || github.event.inputs.lookback_days || '' }}"
          
          CMD="python scripts/main_permits.py --headless"
          if [ -n "$TARGET_DATE" ]; then
            CMD="$CMD --date $TARGET_DATE"
          fi
          if [ -n "$BOND_TYPE" ]; then
            CMD="$CMD --bond $BOND_TYPE"
          fi
          if [ -n "$LOOKBACK_DAYS" ]; then
            CMD="$CMD --lookback-days $LOOKBACK_DAYS"
          fi
          
          echo "🚀 Executing: $CMD"
          eval $CMD

      - name: Upload Scraped JSON Artifact & Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: permit-backups
          path: |
            config/backup_permits_*.json
            debug_screenshots/*.png
            *.png
